oss:
  # 可用的供应商类型
  # 可选值: minio, aliyun, tencent, qiniu, huawei, baidu, aws, google, azure
  provider: "minio"

  # ─── MinIO ───
  minio:
    endpoint: "minio:9000"
    upload_host: "minio:9000"
    download_host: "minio:9000"
    access_key: "root"
    secret_key: "*Abcd123456"
    token: ""
    use_ssl: false

  # ─── 阿里云 OSS ───
  # https://www.aliyun.com/product/oss
  # endpoint 格式: oss-{地域}.aliyuncs.com（如 oss-cn-hangzhou、oss-cn-shanghai）
  #aliyun:
  #  endpoint: "oss-cn-hangzhou.aliyuncs.com"
  #  upload_host: "oss-cn-hangzhou.aliyuncs.com"
  #  download_host: "oss-cn-hangzhou.aliyuncs.com"
  #  access_key: ""
  #  secret_key: ""
  #  region: "cn-hangzhou"
  #  use_ssl: true

  # ─── 腾讯云 COS ───
